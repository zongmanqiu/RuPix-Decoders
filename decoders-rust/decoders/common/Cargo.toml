[package]
name = "rupix-common"
version = "0.2.1"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix 合并解码器：常见位图合集（JPEG/PNG/APNG/GIF/TIFF/QOI/WebP/BMP/ICO/TGA/DDS/PNM/PSD/HDR）"

[lib]
# 目录名 = 解码器 id = lib name（build.ps1 靠这个约定找产物并改名发布）。
# 2026-10-25 晚由 `daily` 改名 `common`：原名是"日常"的白话直译，描述不了这档的
# 任何技术特征；`common` 是行业通用说法（stb_image 自称 common image formats），
# 与 modern / raw 并列时不突兀、无反直觉。
name = "common"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 本 crate 属于仓库根的档 workspace：契约与路由内核走 workspace 继承
# （根 Cargo.toml 的 `[workspace.dependencies]`）。
rupix-abi = { workspace = true }
rupix-merge-router = { workspace = true }

# 成员一律 `default-features = false`：关掉各自的 `standalone`，只拿 `*_impl`，
# 免得 8 份 `#[no_mangle] iv_*` 在同一枚 DLL 里重名（m138 §三）。
#
# 每个成员的 feature 选择就是「纯 Rust 主路径」的落地处：
#   jpeg 关 `turbo`  → 只剩 zune-jpeg 整解，不声明 CAP_SCALED（缩放归基座）；
#   core 开 `webp-rust` → WebP 走 image-webp，不带 libwebp（C）；
#   psd  = zune-psd（zune 家族，与 zune-jpeg 同栈），只解 RGB/RGBA/灰度 8/16bit；
#   hdr  = image crate 的 `hdr` feature（Radiance RGBE → 线性 f32，零额外依赖）。
# psd/hdr 是 2026-10-25 晚替换原 stb 解码器（stb_image 单头 C 库）的纯 Rust 产物：
# 全仓至此零 C 编译依赖。移植时保住了两条 stb 时代的硬结论——HDR 必须走 float
# 路径（8bit 路 13.4 dB vs float 51.2 dB）与 f32→u8 的 clamp+round 归一化口径。
rupix-jpeg = { path = "../../singles/jpeg", default-features = false }
rupix-png = { path = "../../singles/png", default-features = false }
rupix-gif = { path = "../../singles/gif", default-features = false }
rupix-tiff = { path = "../../singles/tiff", default-features = false }
rupix-qoi = { path = "../../singles/qoi", default-features = false }
rupix-psd = { path = "../../singles/psd", default-features = false }
rupix-hdr = { path = "../../singles/hdr", default-features = false }
# 包名 `rupix-core` 的 lib name 是 `core`，与 sysroot 的 `core` 同名；
# 这里显式改名，避免把内置 crate 顶掉。
core_rs = { package = "rupix-core", path = "../../singles/core", default-features = false, features = ["webp-rust"] }
