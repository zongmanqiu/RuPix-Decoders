[package]
name = "rupix-rawpx"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix 解码器：裸像素数据（raw/rgba/gray…，参数化解码）"

[lib]
# 目录名 = 解码器 id = lib name（build.ps1 靠这个约定找产物并改名发布）。
name = "rawpx"
crate-type = ["cdylib", "rlib"]

[features]
# 独立解码器形态：生成 iv_abi_version / iv_decoder_info / iv_last_error / iv_probe / iv_render。
# 合并库依赖时关掉它，否则多个 crate 的 #[no_mangle] iv_* 会在同一枚 DLL 里重名。
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { path = "../../../abi" }
