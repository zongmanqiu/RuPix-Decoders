[package]
name = "rupix-jxl"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix 解码器：JPEG XL (JXL)"

[lib]
# 目录名 = 解码器 id = lib name（build.ps1 靠这个约定找产物并改名发布）。
name = "jxl"
crate-type = ["cdylib", "rlib"]

[features]
# 独立解码器形态：生成 iv_abi_version / iv_decoder_info / iv_last_error / iv_probe / iv_render。
# 合并库依赖时关掉它，否则多个 crate 的 #[no_mangle] iv_* 会在同一枚 DLL 里重名。
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }

# 纯 Rust JPEG XL 解码器。关掉默认特性、只开 moxcms（纯 Rust 色彩管理，不引 lcms2
# 的 C 依赖）。★ 刻意**不开** rayon：参照项目 sriv 开了（`.ex/sriv-main/Cargo.toml:25`），
# 但它是独立可执行程序，我们是**被宿主 dlopen 的 DLL**——解码器规范 §六 第 5 条禁止 DLL
# 内拉起 rayon / 自建线程池（宿主自己管线程，每家 DLL 各开一份全局池就是线程数失控）。
# ★ 单靠这一行挡不住：build.ps1 一次 `cargo build --workspace` 会做 feature 统一，
# `rawler`(rupix-raw) 以 default features 依赖 jxl-oxide，rayon 会被它重新打开。
# 真正生效的是 `src/lib.rs` 里 `JxlImage::builder().pool(JxlThreadPool::none())`。
# 这一行仍然要留着：它保证单独构建本 crate 时也没有池，并且挡住"顺手把 rayon 加回来"。
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"] }
