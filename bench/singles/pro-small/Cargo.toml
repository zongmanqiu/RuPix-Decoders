[package]
name = "rupix-pro-small"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix pro 档成员：PCX / WBMP / XBM / ICNS（小格式合集）"

[lib]
name = "pro_small"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../../pro-support" }
icns = "0.5.0"
pcx = "0.2.5"
wbmp = "0.1.2"
xbm = "0.3.0"
