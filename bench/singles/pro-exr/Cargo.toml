[package]
name = "rupix-pro-exr"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix pro 档成员：OpenEXR（exr crate，线性 f32 → sRGB u8）"

[lib]
name = "pro_exr"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../../pro-support" }
exr = "1.74.2"
