# 编译中间产物一律落在工作区临时区，**不在源码仓库里**：
#   ../../.temp/bench-target（相对 bench/ 本目录：bench -> 仓库根 -> RuPix/.temp，
#   与根 workspace 的 ../.temp/decoder-target、宿主 `.temp/target` 同一个家）
#
# ★ 2026-10-25 修：这里原来写 `../.temp/bench-target`，从 bench/ 解析出来是
#   `RuPix-Decoder/.temp/bench-target`——中间产物落在了源码仓库里（违反本仓 §一.3）。
#   多退一级才是 RuPix/.temp。
#
# 为什么 bench 要有自己的一份：单库与档是两个构建图（feature 隔离，见根
# Cargo.toml 的 exclude 注释与 AGENTS.md §一.5）。两个图共用同一个 target
# 目录会撞输出名——`raw` 单库与 raw 档的 lib name 同名，`raw.dll` / `raw.pdb`
# 会互相覆盖（cargo 报 "output filename collision"，且"将来变成硬错"）。
# 各用各的 target 目录，谁也不会把谁重编一遍。
#
# 口径来源：用户要求"本体源码文件夹要干净一点，构建产物不要混进来"。
# 相对路径（不用绝对路径）：换机器/换盘符不用改这个文件；代价是**相对当前工作目录解析**，
# 所以 cargo 必须从 bench/ 目录跑——`build.ps1` 里 `Push-Location $benchRoot` 保证了这点。
# 想放到别处不用改文件：设环境变量 `CARGO_BUILD_TARGET_DIR`（优先级高于本配置）。
[build]
target-dir = "../../.temp/bench-target"

# 静态链接 MSVC 运行库：插件 DLL 不依赖用户机器上的 VC++ 运行时，
# 单个 DLL 拷进 plugins/ 即用。所有解码库均为纯 Rust，无 C 运行时冲突。
# ★ 这一行与根 `.cargo/config.toml` 逐字相同（两个构建图都要静态 CRT）。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
