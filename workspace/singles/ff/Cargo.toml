license = "AGPL-3.0"
description = "RuPix farbfeld (.ff) decoder"

[lib]
name = "ff"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../shared/pro-support" }
