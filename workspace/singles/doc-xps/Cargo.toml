[package]
name = "rupix-doc-xps"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix doc member: XPS/OXPS through pure-Rust justpdf-formats"

[lib]
name = "doc_xps"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../shared/pro-support" }
justpdf-formats = { version = "0.1.2", features = ["xps"] }
