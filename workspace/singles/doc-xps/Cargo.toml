[package]
name = "rupix-doc-xps"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix doc member: XPS/OXPS page rendering (OPC + FixedPage XML -> SVG)"

[lib]
name = "doc_xps"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../shared/pro-support", features = ["resvg"] }
resvg = "0.49"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
