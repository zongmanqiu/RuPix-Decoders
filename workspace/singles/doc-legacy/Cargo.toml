[package]
name = "rupix-doc-legacy"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix doc member: CMX/WPG/ZMF/ZBR via libcdr/libwpg/libzmf"

[lib]
name = "doc_legacy_impl"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[dependencies]
rupix-abi = { workspace = true }
rupix-pro-support = { path = "../../shared/pro-support" }
resvg = "0.49"

[build-dependencies]
cc = "1"
