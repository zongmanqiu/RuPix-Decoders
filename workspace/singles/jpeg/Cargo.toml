[package]
name = "rupix-jpeg"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix 解码器：JPEG（zune-jpeg，本机实测冠军）"

[lib]
# 目录名 = 解码器 id = lib name（build.ps1 靠这个约定找产物并改名发布）。
name = "jpeg"
crate-type = ["cdylib", "rlib"]

[features]
# 独立解码器形态：生成 iv_abi_version / iv_decoder_info / iv_last_error / iv_probe / iv_render。
# 合并库依赖时关掉它，否则多个 crate 的 #[no_mangle] iv_* 会在同一枚 DLL 里重名。
default = ["standalone", "turbo"]
standalone = []
# 缩放解码腿（libjpeg-turbo，C 静态库）。关掉 = 纯 Rust 构建：只剩 zune-jpeg 整解，
# 不再声明 CAP_SCALED，宿主对缩略图退回"整解后由基座缩"（慢 2.7×，但一个 C 字符都不带）。
# `common` 以 default-features = false 依赖本 crate，就是走这条纯 Rust 路。
turbo = ["dep:turbojpeg"]

[dependencies]
rupix-abi = { workspace = true }
# G1 实测冠军（2026-10-15，run r1792004407 / r1792004645，n=200 median）：
# zune-jpeg 配 `ColorSpace::RGBA` 直出 RGBA8，合计 56.50 ms，比 core 现走的
# `image`→`into_rgba8()` 路线（101.51 ms）快 1.80×，且两种内容（合成雪花 / 照片）
# 都是第一。**libjpeg-turbo 落选**（最优配置 65.80 ms = 1.16×），不是桥接层问题：
# SIMD 已确认编进去（jconfig.h WITH_SIMD 1），fast DCT / fast upsampling 全开。
zune-jpeg = "0.5"
zune-core = "0.5"
# ① 缩放解码（CAP_SCALED）用的第二条腿：libjpeg-turbo 的 DCT 1/8、1/4、1/2 缩放解码。
# 只在 `target` 明显小于原图时启用；满尺寸仍走上面的 zune-jpeg（bench/FINDINGS §缩略图档
# 实测：缩放腿端到端 1.5–1.7×，但 turbo 满尺寸整解比 zune 慢 1.22×，主画面不许换）。
# optional：关掉 `turbo` feature 即纯 Rust（见 [features]）。
turbojpeg = { version = "1.5.1", optional = true }
