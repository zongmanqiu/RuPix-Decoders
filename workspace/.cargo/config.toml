# 编译中间产物一律落在工作区临时区，**不在源码仓库里**：
#   ../../.temp/decoder-target（相对 workspace/ 根，与宿主 `.temp/target` 同一个家）
#
# 口径来源：用户要求"本体源码文件夹要干净一点，构建产物不要混进来"。
# 相对路径（不用绝对路径）：换机器/换盘符不用改这个文件；代价是**相对当前工作目录解析**，
# 所以 cargo 必须从 workspace/ 根跑——`build.ps1` 里 `Push-Location $root` 保证了这点。
# 想放到别处不用改文件：设环境变量 `CARGO_BUILD_TARGET_DIR`（优先级高于本配置）。
# 与宿主 workspace 各用各的 target（宿主在 `../.temp/target`），依赖树互不干扰。
[build]
target-dir = "../../.temp/decoder-target"

# 静态链接 MSVC 运行库：解码器 DLL 不依赖用户机器上的 VC++ 运行时，
# 单个 DLL 拷进 decoders/ 即用。所有解码库均为纯 Rust，无 C 运行时冲突。
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
