[package]
name = "rupix-texture-dll"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix texture tier: DDS/KTX/KTX2/ASTC/PVR/Basis/BLP/VTF"

[lib]
name = "texture"
crate-type = ["cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = []

[workspace]
resolver = "2"

[workspace.dependencies]
rupix-abi = { path = "../../../abi" }
rupix-merge-router = { path = "../../shared/router" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
debug = 1

[dependencies]
rupix-abi = { workspace = true }
rupix-merge-router = { workspace = true }
rupix-texture-impl = { path = "../../singles/texture" }
rupix-texture-ktx2 = { path = "../../singles/texture-ktx2", default-features = false }
