[package]
name = "rupix-raw"
# 0.3.0 → 0.4.0（2026-10-25）：rawpx 并入本档（多一个成员、多一个可选导出
# `iv_render_raw`、认领后缀 29 → 40）。这不是一次"合并出一个新解码器"的版本重置，
# 而是 raw 解码器自身的功能增长，所以延续 0.3.x 的线往上跳小版本。
version = "0.5.3"
edition = "2021"
license = "AGPL-3.0"
description = "RuPix 解码器：相机 RAW（CR2/CR3/NEF/ARW/DNG/RAF 等）+ 裸像素参数化数据（raw/rgba/gray/yuv…）"

[lib]
# 目录名 = 解码器 id = lib name（build.ps1 靠这个约定找产物并改名发布）。
name = "raw"
crate-type = ["cdylib", "rlib"]

[dependencies]
rupix-abi = { workspace = true }
rupix-merge-router = { workspace = true }

# 成员：裸像素数据（无魔数无头，只走参数化的 `iv_render_raw`，见规范 §十二）。
# `default-features = false` 关掉它的 `standalone`——档自己出一套 iv_* 导出，
# 两套 `#[no_mangle]` 在同一枚 DLL 里会重名。
#
# ★ 为什么 rawpx 不在档的 `MEMBERS` 路由表里：它的 `render_impl` 是**刻意的死路**
#   （恒报"需要宽/高/布局参数，请走 iv_render_raw"）。进了让位链只会给每个相机
#   RAW 解码失败添一行"已试：rawpx"的噪声。它唯一的入口就是参数化那条路。
rupix-rawpx = { path = "../../singles/rawpx", default-features = false }

# ── 相机 RAW：rawler（纯 Rust，dnglab 的解码核心，~1000 种相机）──
# 输出是 CFA 拜耳原始数据（u16），不是 sRGB——本解码器内置轻量 develop 管线：
# 线性化(黑/白电平) → 白平衡 → 双线性去马赛克 → 色彩矩阵(cam→sRGB) → sRGB gamma。
# LGPL-2.1：rawler 固定 0.7.2，被静态编进单枚 raw DLL（不是独立 rawler.dll）。
# 发布 ZIP 附 LGPL-2.1 全文与 SOURCE-OFFER.md（上游 commit、crate 校验值、
# 源码/重链接材料的书面提供说明），不内置 rawler 源码。
rawler = "0.7.2"

# X3F fallback: rawler 0.7.2 exposes the X3F container but its compressed
# sensor path is `not implemented`; flashraw (MIT/Apache-2.0) supplies the
# real frame. Only used when rawler fails on .x3f.
flashraw = { version = "0.1.1", default-features = false, features = ["simd", "icc"] }
